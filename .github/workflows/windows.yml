name: Windows validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "10-tools/cli/cgcli/**"
      - "10-tools/software/congguo-depth-studio/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows.yml"
      - "10-tools/cli/cgcli/**"
      - "10-tools/software/congguo-depth-studio/**"

permissions:
  contents: read

jobs:
  validate-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: 10-tools/software/congguo-depth-studio

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            10-tools/software/congguo-depth-studio/pyproject.toml
            10-tools/cli/cgcli/pyproject.toml

      - name: Install dependencies and verified model
        run: .\scripts\setup-windows.ps1 -PythonCommand python

      - name: Run App and CLI test suite
        run: |
          .\.venv\Scripts\python.exe -m ruff check src tests ..\..\cli\cgcli\src ..\..\cli\cgcli\tests
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Windows Ruff check failed::Ruff returned $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          .\.venv\Scripts\python.exe -m pytest -q tests ..\..\cli\cgcli\tests
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Windows tests failed::pytest returned $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Build and verify portable App and embedded CLI
        run: |
          try {
            .\scripts\build-windows.ps1 -SkipSetup -SkipTests -SkipArchive
          }
          catch {
            $Message = $_.Exception.Message.Replace("`r", " ").Replace("`n", " ")
            Write-Output "::error title=Windows package build failed::$Message"
            exit 1
          }

      - name: Confirm expected hosts exist
        run: |
          if (-not (Test-Path .\dist\CongGuoDepthStudio\CongGuoDepthStudio.exe)) {
            throw "GUI host is missing"
          }
          if (-not (Test-Path .\dist\CongGuoDepthStudio\CongGuoCliHost.exe)) {
            throw "CLI host is missing"
          }
